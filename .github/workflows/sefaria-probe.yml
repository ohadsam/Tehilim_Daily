name: Sefaria probe
# The sandbox cannot reach sefaria.org, so the live API contract is verified here.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
  push:
    paths:
      - 'tools/sefaria_probe.py'
      - '.claude/skills/sefaria-api/**'
      - '.github/workflows/sefaria-probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Fetch all 150 chapters and check integrity
        shell: bash
        run: |
          set -o pipefail
          python3 tools/sefaria_probe.py | tee probe.txt
      - name: sefaria-api skill probe (shape + Hebrew check, sample refs)
        run: python3 .claude/skills/sefaria-api/scripts/sefaria_probe.py text "Psalms.1" "Psalms.23" "Psalms.119" "Psalms.150" | tee -a probe.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: sefaria-probe, path: probe.txt }
