name: Sefaria probe
# The sandbox cannot reach sefaria.org, so the live API contract is verified here.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
  push:
    paths:
      - 'tools/sefaria_probe.py'
      - '.github/workflows/sefaria-probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Fetch all 150 chapters and check integrity
        run: python3 tools/sefaria_probe.py | tee probe.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: sefaria-probe, path: probe.txt }
