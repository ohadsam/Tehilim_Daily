name: Release build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # publishes the GitHub Release the in-app updater reads
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Unit tests, release APK and AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease bundleRelease --stacktrace
      - name: Publish GitHub Release (the app's update check reads the latest one)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          META=app/build/outputs/apk/release/output-metadata.json
          VER=$(python3 -c "import json;print(json.load(open('$META'))['elements'][0]['versionName'])")
          CODE=$(python3 -c "import json;print(json.load(open('$META'))['elements'][0]['versionCode'])")
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          NAME="tehilim-daily-${VER}-b${CODE}.apk"
          TAG="v${VER}-b${CODE}"
          cp "$APK" "$RUNNER_TEMP/$NAME"
          # Stable file names for fixed download links (the OS APPs and Downs store links releases/latest/download/tehilim-daily.apk).
          cp "$APK" "$RUNNER_TEMP/tehilim-daily.apk"
          (cd "$RUNNER_TEMP" && sha256sum tehilim-daily.apk > tehilim-daily.apk.sha256)
          FILES=("$RUNNER_TEMP/$NAME" "$RUNNER_TEMP/tehilim-daily.apk" "$RUNNER_TEMP/tehilim-daily.apk.sha256")
          python3 -c "import json;d=json.load(open('app/src/main/assets/whatsnew.json'));print('\n'.join('- '+i for i in d['items']))" > "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" --target "$GITHUB_SHA" --title "Tehilim Daily ${VER}" --notes-file "$RUNNER_TEMP/notes.md" --latest
          fi
      - uses: actions/upload-artifact@v4
        continue-on-error: true  # the Release below is the durable copy; the artifact quota may be full
        with:
          name: release-artifacts
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
